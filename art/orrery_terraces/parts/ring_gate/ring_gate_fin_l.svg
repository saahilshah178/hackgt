<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 360" width="120" height="360" data-pivot="1,1">
<!-- Tidewheel keystone fin, left half (trig A88): a tall tapered gold blade with a navy slot line; the halves split ±24 on success. -->
