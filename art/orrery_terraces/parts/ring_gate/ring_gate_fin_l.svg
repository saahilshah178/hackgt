<path d="M120 50 L70 80 L58 94 L58 248 L80 290 L98 360 L120 360 Z" fill="{{gold.deep}}"/>
<path d="M117 55 L73 80 L61 94 L61 248 L83 290 L101 356 L117 356 Z" fill="url(#gold)"/>
<path d="M116 54 L72 82 L62 95 L62 246" fill="none" stroke="{{gold.hi}}" stroke-width="5" stroke-linejoin="round"/>
<rect x="112" y="54" width="5" height="302" fill="{{gold.deep}}"/>
<rect x="101" y="92" width="6" height="236" rx="3" fill="{{inlay.navy}}"/>
<rect x="105" y="92" width="2" height="236" fill="{{inlay.navy.dark}}"/>
<circle cx="82" cy="140" r="13" fill="{{gold.hi}}"/><circle cx="82" cy="140" r="10" fill="{{inlay.navy}}"/><circle cx="80" cy="138" r="3" fill="{{gold.hi}}"/>
<path d="M70 196 L96 180 M70 224 L96 208" stroke="{{gold.deep}}" stroke-width="3" stroke-linecap="round"/>
<circle id="anchor-fin_split" cx="120" cy="56" r="0"/>
</svg>
