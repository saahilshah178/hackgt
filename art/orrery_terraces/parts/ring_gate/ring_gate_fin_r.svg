<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 360" width="120" height="360" data-pivot="0,1">
<!-- Tidewheel keystone fin, right half (trig A89): a tall tapered gold blade with a navy slot line; the halves split ±24 on success. -->
<defs><linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="0" y2="0"><stop offset="0" stop-color="{{gold.hi}}"/><stop offset="0.45" stop-color="{{gold.base}}"/><stop offset="1" stop-color="{{gold.deep}}"/></linearGradient><filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<path d="M0 50 L50 80 L62 94 L62 248 L40 290 L22 360 L0 360 Z" fill="{{gold.deep}}"/>
<path d="M3 55 L47 80 L59 94 L59 248 L37 290 L19 356 L3 356 Z" fill="url(#gold)"/>
<path d="M3 56 L3 354 M4 54 L48 82" fill="none" stroke="{{gold.hi}}" stroke-width="5" stroke-linejoin="round"/>
<path d="M50 82 L60 95 L60 248 L39 290 L22 356" fill="none" stroke="{{gold.deep|dim:0.2}}" stroke-width="5" stroke-linejoin="round"/>
<rect x="13" y="92" width="6" height="236" rx="3" fill="{{inlay.navy}}"/>
<rect x="15" y="92" width="2" height="236" fill="{{inlay.navy.dark}}"/>
<circle cx="38" cy="140" r="13" fill="{{gold.hi}}"/><circle cx="38" cy="140" r="10" fill="{{inlay.navy}}"/><circle cx="36" cy="138" r="3" fill="{{gold.hi}}"/>
<path d="M50 196 L24 180 M50 224 L24 208" stroke="{{gold.deep}}" stroke-width="3" stroke-linecap="round"/>
<circle id="anchor-fin_split" cx="0" cy="56" r="0"/>
</svg>
