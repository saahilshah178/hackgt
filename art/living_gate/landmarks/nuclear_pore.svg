<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1040" width="960" height="1040" data-pivot="0.5,1">
  <!-- living_gate.prop.nuclear_pore (cell §6.2, §7.8): the Nuclear Pore, zone D's hub gate, 5.5 H. Cream outer ring
       with a gold rim and navy inlay, 8 spokes (the pore complex's eightfold symmetry), a bronze inner ring around the
       deep nuclear glow, 11 bronze conduit sockets on the upper arc (one per restored gate), and the split gold fin on
       top (bible frame 3). It stands on a stepped threshold that sits on the causeway (the pivot). -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{{atp.gold.core|alpha:0.9}}"/>
      <stop offset="0.45" stop-color="{{nucleus.dome|mix:atp.gold:0.3}}"/>
      <stop offset="1" stop-color="{{oil.seam.dark}}"/>
    </radialGradient>
    <radialGradient id="void" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="{{nucleus.dome.shade|alpha:0.75}}"/>
      <stop offset="1" stop-color="{{oil.seam.dark|alpha:0.85}}"/>
    </radialGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.6" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <filter id="blur8" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
