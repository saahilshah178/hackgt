  <!-- living_gate.prop.stiff_ridge (cell §1.3 e1, §7.5): the Stiff Ridge, membrane frozen rigid (gel phase) into a
       wall 1.4 H high. The pivot is the ridge's LEFT foot on the walk line (the blocker sits at world x 4560, where the
       ground is still y 983); the ridge fills the right half (SVG x 760..1520 = world x 4560..5320, the heightfield's
       y-745 plateau at SVG y 52). Frosted lipid heads over dead-still frozen tails, a dim oil seam, ice facets and
       frost sparkles on top, a shadowed cavity at its foot. The e1 payoff melts it into the low ramp. -->
  <defs>
