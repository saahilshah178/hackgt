      <stop offset="0" stop-color="{{gel.frost.lit}}"/>
      <stop offset="0.5" stop-color="{{gel.frost}}"/>
      <stop offset="1" stop-color="{{gel.frost.shade}}"/>
    </linearGradient>
    <radialGradient id="head" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="{{gel.frost.lit}}"/>
      <stop offset="0.7" stop-color="{{lipid.head|mix:gel.frost:0.6}}"/>
      <stop offset="1" stop-color="{{gel.frost.shade}}"/>
    </radialGradient>
    <radialGradient id="cave" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="{{oil.seam.dark|alpha:0.55}}"/>
      <stop offset="1" stop-color="{{oil.seam.dark|alpha:0}}"/>
    </radialGradient>
    <filter id="blur6" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
