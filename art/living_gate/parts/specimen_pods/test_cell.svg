    <circle cx="140" cy="140" r="102" fill="none" stroke="{{gold.base}}" stroke-width="3"/>
    <circle cx="160" cy="150" r="26" fill="{{cell.nucleus}}"/>
    <circle cx="154" cy="143" r="9" fill="{{nucleus.dome.lit}}"/>
