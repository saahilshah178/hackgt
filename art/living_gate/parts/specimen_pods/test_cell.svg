<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" data-pivot="0.5,0.5">
  <!-- living_gate.part.specimen_pods_test_cell: the e4 test cell (cell §5.4): a circular bilayer of tiny heads with a gold inner line around peach cytoplasm, a nucleus and three organelle specks. The prefab scales it live with the water that crosses in or out. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.55" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.34" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.45" stop-color="{{crystal.hi}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="headG" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="{{lipid.head.lit}}"/>
      <stop offset="1" stop-color="{{lipid.head.shade}}"/>
    </radialGradient>
  </defs>
  <g id="lit">
