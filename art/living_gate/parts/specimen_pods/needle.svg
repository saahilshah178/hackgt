<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 240" width="60" height="240" data-pivot="0.5,0">
  <!-- living_gate.part.specimen_pods_needle: the e1 probe needle (cell §5.1): a cream-and-gold piston hanging from its top pivot with a thin gold tip that presses into the lipid heads (anchor tip). -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.55" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.34" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.45" stop-color="{{crystal.hi}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    
  </defs>
  <g id="lit">
    <rect x="10" y="0" width="40" height="12" rx="4" fill="url(#gold)"/>
    <rect x="14" y="10" width="32" height="84" rx="6" fill="url(#stone)"/>
    <rect x="14" y="30" width="32" height="8" fill="{{inlay.navy}}"/>
    <rect x="14" y="66" width="32" height="8" fill="{{inlay.navy}}"/>
    <path d="M 20 14 L 20 90" stroke="{{haze|alpha:0.7}}" stroke-width="3" stroke-linecap="round"/>
    <rect x="12" y="90" width="36" height="10" rx="3" fill="url(#gold)"/>
    <rect x="24" y="100" width="12" height="96" rx="3" fill="url(#stone)"/>
    <rect x="21" y="150" width="18" height="6" rx="2" fill="{{gold.base}}"/>
    <path d="M 24 196 L 36 196 L 31 238 L 29 238 Z" fill="url(#gold)"/>
    <path d="M 26 198 L 29.5 236" stroke="{{gold.hi}}" stroke-width="1.2"/>
  </g>
  <circle id="anchor-tip" cx="30" cy="238" r="0"/>
</svg>
