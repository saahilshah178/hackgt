<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 60" width="860" height="60" data-pivot="0.5,0.5">
  <!-- living_gate.part.specimen_pods_balance_beam: the e3 Balance Lock beam (cell §5.3): a gold beam with a navy inlay, a hub ring at its centre (the pivot) and hooks hanging at both ends. It levels only at equilibrium, then lifts like a boom. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.55" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.34" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.45" stop-color="{{crystal.hi}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    
  </defs>
  <g id="lit">
    <path d="M 20 18 L 840 18 L 852 30 L 840 42 L 20 42 L 8 30 Z" fill="url(#gold)"/>
    <rect x="30" y="26" width="800" height="8" fill="{{inlay.navy}}"/>
    <path d="M 24 20 L 836 20" stroke="{{gold.hi}}" stroke-width="2"/>
    <circle cx="60" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="134" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="208" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="282" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="356" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="504" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="578" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="652" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="726" cy="30" r="3" fill="{{gold.hi}}"/><circle cx="800" cy="30" r="3" fill="{{gold.hi}}"/>
    <path d="M 22 42 L 22 52 C 22 60 34 60 34 52" fill="none" stroke="{{bronze.ring}}" stroke-width="4" stroke-linecap="round"/>
    <path d="M 838 42 L 838 52 C 838 60 826 60 826 52" fill="none" stroke="{{bronze.ring}}" stroke-width="4" stroke-linecap="round"/>
    <circle cx="430" cy="30" r="28" fill="url(#gold)" stroke="{{gold.deep}}" stroke-width="3"/>
    <circle cx="430" cy="30" r="16" fill="none" stroke="{{inlay.navy}}" stroke-width="5"/>
    <circle cx="430" cy="30" r="6" fill="{{bronze.ring}}"/>
  </g>
  <circle id="anchor-hub" cx="430" cy="30" r="0"/>
  <circle id="anchor-hook_l" cx="28" cy="58" r="0"/>
  <circle id="anchor-hook_r" cx="832" cy="58" r="0"/>
</svg>
