<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" data-pivot="0.5,1">
  <!-- living_gate.part.specimen_pods_flume_pump: the e7 flume pump (cell §5.7): a cream pump body with gold trim and navy bands, a gold ATP feed port on its side and an outlet spout; the piston on top is its own group (id piston) so the prefab can stroke it. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.55" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.34" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.45" stop-color="{{crystal.hi}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    
  </defs>
  <g id="shade">
    <ellipse cx="108" cy="255" rx="86" ry="6" fill="{{shadow|alpha:0.3}}" filter="url(#soft)"/>
  </g>
  <g id="piston">
    <rect x="86" y="0" width="28" height="80" rx="5" fill="url(#stone)"/>
    <rect x="80" y="0" width="40" height="12" rx="4" fill="url(#gold)"/>
    <rect x="86" y="40" width="28" height="6" fill="{{inlay.navy}}"/>
  </g>
  <g id="lit">
    <path d="M 30 260 L 36 96 C 36 84 46 76 58 76 L 142 76 C 154 76 164 84 164 96 L 170 260 Z" fill="url(#stone)"/>
    <path d="M 150 80 C 160 84 164 90 164 96 L 170 260 L 150 260 Z" fill="{{stone.shade}}"/>
    <rect x="30" y="70" width="140" height="14" rx="5" fill="url(#gold)"/>
    <rect x="32" y="130" width="136" height="12" fill="{{inlay.navy}}"/>
    <rect x="30" y="220" width="140" height="12" fill="{{inlay.navy}}"/>
    <rect x="26" y="244" width="148" height="16" rx="3" fill="url(#gold)"/>
    <circle cx="100" cy="180" r="26" fill="none" stroke="{{gold.base}}" stroke-width="6"/>
    <circle cx="100" cy="180" r="15" fill="{{inlay.navy}}"/>
    <circle cx="100" cy="180" r="9" fill="{{atp.gold}}"/>
    <circle cx="97" cy="177" r="3.5" fill="{{atp.gold.core}}"/>
    <path d="M 48 92 L 44 236" stroke="{{haze|alpha:0.6}}" stroke-width="5" stroke-linecap="round"/>
    <path d="M 164 150 L 196 150 L 196 172 L 186 172 L 186 162 L 164 162 Z" fill="url(#gold)"/>
    <circle cx="190" cy="178" r="5" fill="{{tide.deep}}"/>
    <circle cx="20" cy="112" r="16" fill="url(#gold)"/>
    <circle cx="20" cy="112" r="8" fill="{{atp.gold.core}}"/>
    <rect x="20" y="104" width="18" height="16" fill="{{gold.deep}}"/>
  </g>
  <circle id="anchor-piston" cx="100" cy="0" r="0"/>
  <circle id="anchor-feed_port" cx="20" cy="112" r="0"/>
  <circle id="anchor-outlet" cx="190" cy="178" r="0"/>
</svg>
