<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" width="80" height="64" data-pivot="0.5,1">
  <!-- living_gate.part.specimen_pods_mimic_mote: the Mimic Mote (cell §5.P, requested slot): a translucent jelly blob with two dot eyes that squats in every quarantine pod. One frame (the squished rest pose); the prefab squashes and stretches it with scale, so the kit fallback (80 wide, one frame) and the hero draw the same way. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.55" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.34" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.45" stop-color="{{crystal.hi}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    
  </defs>
  <g id="glow">
    <ellipse cx="40" cy="58" rx="30.6" ry="3" fill="{{shadow|alpha:0.25}}"/>
    <path d="M 6 51.0 C 6 28.0 23.0 20 40 20 C 58.7 20 74 29.0 74 50.0 C 70.6 60 9.399999999999999 60 6 51.0 Z" fill="{{mote.jelly|alpha:0.72}}" stroke="{{mote.jelly.shade}}" stroke-width="2"/>
    <ellipse cx="24.7" cy="31.0" rx="7.48" ry="3.2" fill="{{haze|alpha:0.9}}"/>
    <circle cx="30.479999999999997" cy="40" r="3.4" fill="{{mote.eye}}"/>
    <circle cx="49.52" cy="40" r="3.4" fill="{{mote.eye}}"/>
    <circle cx="29.479999999999997" cy="38.8" r="1.1" fill="{{haze}}"/>
    <circle cx="48.52" cy="38.8" r="1.1" fill="{{haze}}"/>
  </g>
  <circle id="anchor-eyes" cx="40" cy="40" r="0"/>
</svg>
