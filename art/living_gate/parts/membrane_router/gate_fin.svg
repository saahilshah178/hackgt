<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 300" width="90" height="300" data-pivot="0.95,1">
  <!-- living_gate.part.membrane_router_gate_fin: the left gold keystone fin half of the Crossing Gate (bible frame 3's split fin; the right fin is this file flipped). The pivot is the base of its inner edge, where the two halves split apart on success. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.55" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{gold.hi}}"/>
      <stop offset="0.55" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.deep}}"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.34" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.45" stop-color="{{crystal.hi}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{gold.deep}}"/>
      <stop offset="0.5" stop-color="{{gold.base}}"/>
      <stop offset="1" stop-color="{{gold.hi}}"/>
    </linearGradient>
  </defs>
  <g id="lit">
    <path d="M 86 300 L 86 4 C 50 30 18 90 6 170 C 2 214 10 262 26 300 Z" fill="url(#finGrad)"/>
    <path d="M 86 300 L 86 4 C 70 16 56 32 46 50 L 46 300 Z" fill="{{gold.hi|alpha:0.45}}"/>
    <path d="M 78 280 L 78 30" stroke="{{inlay.navy}}" stroke-width="8"/>
    <circle cx="50" cy="150" r="17" fill="none" stroke="{{inlay.navy}}" stroke-width="5"/>
    <circle cx="50" cy="150" r="7" fill="{{crystal.base}}"/>
    <circle cx="44" cy="228" r="11" fill="none" stroke="{{inlay.navy}}" stroke-width="4"/>
    <circle cx="60" cy="82" r="9" fill="none" stroke="{{inlay.navy}}" stroke-width="3.5"/>
    <path d="M 86 4 C 50 30 18 90 6 170 C 2 214 10 262 26 300" fill="none" stroke="{{gold.deep}}" stroke-width="3"/>
  </g>
  <circle id="anchor-fin_tip" cx="86" cy="4" r="0"/>
</svg>
