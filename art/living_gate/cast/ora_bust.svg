      <stop offset="0.6" stop-color="{{tide.shallow|mix:stone.lit:0.55}}"/>
      <stop offset="1" stop-color="{{tide.deep|mix:stone.base:0.35}}"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
