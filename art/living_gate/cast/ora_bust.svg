      <stop offset="0.6" stop-color="{{char.ora.suit}}"/>
      <stop offset="1" stop-color="{{char.ora.suitShade}}"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.35" r="0.75">
