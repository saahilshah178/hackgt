<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" data-pivot="0.5,0.5">
  <!-- living_gate.companion.ora_bust (cell §3.2): Pilot Ora in the Halcyon's comms porthole, grinning. 8 parts: the
       bronze porthole frame, torso with the back hair cloud (clipped to the glass), head with the front fringe,
       brass headset, goggles pushed up, eyes (open / blink), brows (grin / focus) and mouth (grin / open). -->
