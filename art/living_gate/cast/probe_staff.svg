<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 184" width="28" height="184" data-pivot="0.5,0.185">
  <!-- living_gate.costume.probe_staff (cell §3.1): a cream staff, gold ferrule and grip bands, a glass bulb.
       Authored at the hand's rot 0: the rig's idle hand_r carries rot 180, so the bulb is drawn at the BOTTOM here and
       reads at the top in play. The pivot (14, 34) is the grip, 34 units from the butt, so the butt stays above the
       ground line in idle. The bulb glass is near-white so the host's tint (cyan while a panel is open, orange while
       dragging) reads cleanly. -->
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{stone.lit}}"/>
      <stop offset="0.6" stop-color="{{stone.base}}"/>
      <stop offset="1" stop-color="{{stone.shade}}"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="{{haze}}"/>
      <stop offset="0.6" stop-color="{{glass.tint}}"/>
      <stop offset="1" stop-color="{{crystal.base}}"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <g id="lit">
    <rect x="9" y="2" width="10" height="8" rx="3" fill="{{gold.deep}}"/>
    <rect x="10" y="8" width="8" height="138" rx="3" fill="url(#shaft)"/>
    <rect x="11" y="10" width="2" height="134" fill="{{stone.lit}}"/>
    <rect x="8.5" y="24" width="11" height="20" rx="3" fill="{{inlay.navy}}"/>
    <path d="M 9 28 L 19 26 M 9 33 L 19 31 M 9 38 L 19 36 M 9 43 L 19 41" stroke="{{inlay.navy|light:0.3}}" stroke-width="1.2"/>
    <rect x="8" y="92" width="12" height="6" rx="2" fill="{{gold.base}}"/>
    <rect x="8" y="92" width="12" height="2" rx="1" fill="{{gold.hi}}"/>
  </g>
  <g id="trim">
    <path d="M 6 140 L 22 140 L 20 154 L 8 154 Z" fill="{{gold.base}}"/>
    <path d="M 6 140 L 22 140 L 21.5 144 L 6.5 144 Z" fill="{{gold.hi}}"/>
    <path d="M 8 152 C 3 158 3 168 7 174 M 20 152 C 25 158 25 168 21 174" fill="none" stroke="{{gold.deep}}" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g id="glow">
    <circle cx="14" cy="166" r="11" fill="{{glass.tint|alpha:0.6}}" filter="url(#soft)"/>
    <circle cx="14" cy="165" r="9" fill="url(#bulb)" stroke="{{crystal.hi}}" stroke-width="1.2"/>
    <ellipse cx="11" cy="161" rx="3" ry="2" fill="{{haze|alpha:0.9}}"/>
  </g>
</svg>
